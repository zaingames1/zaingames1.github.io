<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zain Games - جيلبريك 11.50 - 13.00</title>
<link rel="icon" type="image/png" href="ZainGames.png">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    background: #080a10 radial-gradient(ellipse at 50% 10%, #151d30 0%, #080a10 80%);
    color: #cbd5e1;
    font-family: "Segoe UI", -apple-system, system-ui, Tahoma, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  #brand {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 20px;
    background: #0d121c;
    border-bottom: 1px solid #1e293b;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  .brand-logo-wrap {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  #brand img {
    width: 40px; height: 40px;
    border-radius: 8px;
    box-shadow: 0 0 12px rgba(0, 112, 209, 0.4);
    vertical-align: middle;
  }
  .brand-name {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: .05em;
    background: linear-gradient(90deg, #38bdf8, #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .brand-sub {
    font-size: 12px;
    color: #94a3b8;
    font-weight: 600;
  }
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 14px;
    background: #1e293b;
    color: #f8fafc;
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    transition: all 0.2s ease;
  }
  .back-btn:hover {
    background: #334155;
    border-color: #38bdf8;
    color: #38bdf8;
  }

  #container {
    max-width: 500px;
    margin: 28px auto;
    padding: 0 16px;
  }
  #wrap {
    background: #0f172a;
    border: 1px solid #1e293b;
    border-radius: 18px;
    padding: 26px 22px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    position: relative;
    overflow: hidden;
  }
  #wrap::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, #0070d1, #a855f7, #00d2ff);
  }
  .badge-range {
    display: inline-block;
    background: rgba(56, 189, 248, 0.12);
    border: 1px solid rgba(56, 189, 248, 0.35);
    color: #38bdf8;
    padding: 4px 12px;
    border-radius: 20px;
    font-weight: 700;
    font-size: 13px;
    margin-bottom: 14px;
  }
  #state {
    font-size: 21px;
    font-weight: 800;
    margin: 0 0 12px;
    color: #f8fafc;
  }
  #det {
    font-size: 13px;
    color: #94a3b8;
    margin: 0 0 16px;
    padding: 10px 14px;
    background: #1e293b;
    border-radius: 12px;
    display: inline-block;
  }
  #det b { color: #f8fafc; font-weight: 700; }
  #cache {
    font-size: 13px;
    color: #64748b;
    margin: 8px 0 0;
    min-height: 18px;
    font-weight: 500;
  }
  #cache.cacheok { color: #10b981; font-weight: 600; }
  .ok { color: #10b981; }
  .bad { color: #ef4444; }
  .warn { color: #f59e0b; }

  .quick-go-btn {
    display: inline-block;
    background: linear-gradient(90deg, #0070d1, #00d2ff);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 10px 24px;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    margin: 12px auto 4px;
    font-family: inherit;
    box-shadow: 0 4px 14px rgba(0, 112, 209, 0.4);
    transition: transform 0.15s ease;
  }
  .quick-go-btn:hover {
    transform: translateY(-2px);
  }

  .contact-section {
    margin-top: 18px;
    background: #0f172a;
    border: 1px solid #1e293b;
    border-radius: 16px;
    padding: 16px;
    text-align: center;
  }
  .contact-head {
    font-size: 13px;
    font-weight: 700;
    color: #94a3b8;
    margin-bottom: 12px;
  }
  .contact-grid {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .contact-btn {
    flex: 1;
    min-width: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 10px 14px;
    background: #1e293b;
    border-radius: 12px;
    text-decoration: none;
    color: #f8fafc;
    border: 1px solid transparent;
    transition: transform 0.2s ease;
  }
  .contact-btn.wa {
    border-color: rgba(37, 211, 102, 0.4);
    background: rgba(37, 211, 102, 0.08);
  }
  .contact-btn.phone {
    border-color: rgba(0, 112, 209, 0.4);
    background: rgba(0, 112, 209, 0.08);
  }
  .btn-icon { font-size: 18px; }
  .btn-label { font-size: 11px; color: #94a3b8; display: block; text-align: right; }
  .btn-val { font-size: 14px; font-weight: 700; color: #f8fafc; letter-spacing: 0.5px; }
</style>
</head>
<body>
<div id="brand">
  <div class="brand-logo-wrap">
    <img src="ZainGames.png" alt="Zain Games">
    <div class="brand-text">
      <div class="brand-name">Zain Games</div>
      <div class="brand-sub">تعديل وصيانة البلايستيشن</div>
    </div>
  </div>
  <a href="../index.html" class="back-btn">⬅ القائمة الرئيسية</a>
</div>

<div id="container">
  <div id="wrap">
    <div class="badge-range">نظام التشغيل: 11.50 – 13.00</div>
    <div id="state">جارٍ فحص إصدار النظام...</div>
    <div id="det"></div>
    <div id="cache"></div>
    <div id="action-wrap" style="display:none; margin-top:12px;">
      <button id="goBtn" class="quick-go-btn" type="button">⚡ بدء التفعيل الآن</button>
    </div>
  </div>

  <div class="contact-section">
    <div class="contact-head">مركز Zain Games &bull; صيانة وتعديل وألعاب &bull; سوهاج</div>
    <div class="contact-grid">
      <a href="https://wa.me/201129060303" class="contact-btn wa" target="_blank">
        <span class="btn-icon">💬</span>
        <div>
          <span class="btn-label">واتساب</span>
          <span class="btn-val" dir="ltr">01129060303</span>
        </div>
      </a>
      <a href="tel:01064430855" class="contact-btn phone">
        <span class="btn-icon">📞</span>
        <div>
          <span class="btn-label">موبايل</span>
          <span class="btn-val" dir="ltr">01064430855</span>
        </div>
      </a>
    </div>
  </div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    var actionWrap = document.getElementById("action-wrap");
    var goBtn = document.getElementById("goBtn");

    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var minor = parseInt(m[2], 16);
        var ms = minor.toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }
    var bug = null, why = "";
    var forced = params.get("bug");
    if (forced === "lapse" || forced === "poops") {
        bug = forced; why = "تم التحديد عبر الرابط: " + forced;
    } else if (!key) {
        why = "المتصفح ليس جهاز PlayStation 4";
    } else if (fwnum <= 1202) {
        bug = "lapse"; why = key + " <= 12.02 (Lapse)";
    } else if (fwnum >= 1250) {
        bug = "poops"; why = key + " >= 12.50 (Poops)";
    } else {
        why = key + " -- لا توجد ثغرة مناسبة لهذا الإصدار تحديداً";
    }
    detEl.innerHTML = "إصدار جهازك: <b>" + (key || "غير معروف") + "</b>"
        + " &bull; نوع الثغرة: <b>" + (bug || "غير متوفرة") + "</b> &bull; " + why;

    if (!bug) {
        setState("إصدار غير مدعوم في هذا القسم", "bad");
        return;
    }

    var target = (bug === "lapse" ? "run_lapse.html" : "run_poops.html")
        + location.search;
    function go() {
        setState("جارٍ تشغيل ثغرة " + bug + "...", "warn");
        location.replace(target);
    }

    actionWrap.style.display = "block";
    goBtn.onclick = go;

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    // Auto trigger on tap anywhere
    window.addEventListener("click", function() { go(); }, { once: true });
    window.addEventListener("keydown", function() { go(); }, { once: true });

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("وضع عدم الاتصال -- تم التحميل من الكاش", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("محفوظ في الذاكرة (أوفلاين جاهز)", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("تم تنزيل التحديث", true);
        waitForTap("تم التحديث -- اضغط X أو المس الشاشة للمتابعة", function () { location.reload(); });
    } else {
        setCache("جارٍ التحقق من الكاش...");
        ac.addEventListener("downloading",
            function () { setCache("جارٍ حفظ الملفات للاستخدام بدون إنترنت..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("جارٍ الحفظ " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);

        ac.addEventListener("cached", function () {
            setCache("تم الحفظ بنجاح أوفلاين", true);
            setTimeout(go, 200);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("تم تنزيل التحديث", true);
            location.reload();
        }, false);

        ac.addEventListener("noupdate", function () {
            setCache("الكاش جاهز للاستخدام بدون إنترنت", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("الكاش متوفر");
            go();
        }, false);
        ac.addEventListener("obsolete", function () {
            go();
        }, false);
    }
})();
</script>
</body>
</html>
