<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Zain Games - لخدمات البلايستيشن المتكاملة</title>
<link rel="icon" type="image/png" href="ZainGames.png">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; min-height: 100vh;
    background: #080a10 radial-gradient(ellipse at 50% 10%, #151d30 0%, #080a10 80%);
    color: #cbd5e1;
    font-family: "Segoe UI", -apple-system, system-ui, Tahoma, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }
  #brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 12px 16px;
    background: #0d121c;
    border-bottom: 1px solid #1e293b;
    box-shadow: 0 4px 20px rgba(0,0,0,0.4);
  }
  #brand img {
    width: 40px; height: 40px;
    border-radius: 8px;
    box-shadow: 0 0 12px rgba(0, 112, 209, 0.4);
    vertical-align: middle;
  }
  .brand-text {
    text-align: right;
  }
  .brand-name {
    font-size: 18px;
    font-weight: 800;
    color: #f8fafc;
    letter-spacing: .06em;
    background: linear-gradient(90deg, #38bdf8, #818cf8);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .brand-sub {
    font-size: 12px;
    color: #94a3b8;
    font-weight: 600;
  }

  #container {
    max-width: 500px;
    margin: 24px auto;
    padding: 0 16px;
  }
  #wrap {
    background: #0f172a;
    border: 1px solid #1e293b;
    border-radius: 18px;
    padding: 24px 20px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    position: relative;
    overflow: hidden;
  }
  #wrap::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, #0070d1, #a855f7, #00d2ff);
  }
  #state {
    font-size: 21px;
    font-weight: 800;
    margin: 0 0 14px;
    color: #f8fafc;
  }
  #det {
    font-size: 14px;
    color: #94a3b8;
    margin: 0 0 16px;
    padding: 10px 14px;
    background: #1e293b;
    border-radius: 12px;
    display: inline-block;
  }
  #det b { color: #f8fafc; font-weight: 700; }
  .ok {
    color: #10b981;
    background: rgba(16, 185, 129, 0.15);
    border: 1px solid rgba(16, 185, 129, 0.4);
    padding: 3px 10px;
    border-radius: 8px;
    font-weight: 700;
  }
  .bad {
    color: #ef4444;
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.4);
    padding: 3px 10px;
    border-radius: 8px;
    font-weight: 700;
  }
  .warn {
    color: #f59e0b;
    background: rgba(245, 158, 11, 0.15);
    border: 1px solid rgba(245, 158, 11, 0.4);
    padding: 3px 10px;
    border-radius: 8px;
    font-weight: 700;
  }

  /* Supported Firmwares Box */
  .fw-box {
    background: #141d2e;
    border: 1px solid rgba(255, 255, 255, 0.06);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 14px;
  }
  .fw-title {
    font-size: 12px;
    color: #94a3b8;
    margin-bottom: 8px;
    font-weight: 600;
  }
  .fw-badges {
    display: flex;
    justify-content: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .fw-badge {
    background: #1e293b;
    border: 1px solid rgba(56, 189, 248, 0.3);
    color: #38bdf8;
    font-size: 13px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 6px;
  }

  #cache {
    font-size: 13px;
    color: #64748b;
    margin: 4px 0 0;
    min-height: 18px;
    font-weight: 500;
  }
  #cache.cacheok {
    color: #10b981;
    font-weight: 600;
  }

  .contact-section {
    margin-top: 18px;
    background: #0f172a;
    border: 1px solid #1e293b;
    border-radius: 16px;
    padding: 16px;
    text-align: center;
  }
  .contact-head {
    font-size: 13px;
    font-weight: 700;
    color: #94a3b8;
    margin-bottom: 12px;
  }
  .contact-grid {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .contact-btn {
    flex: 1;
    min-width: 180px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 10px 14px;
    background: #1e293b;
    border-radius: 12px;
    text-decoration: none;
    color: #f8fafc;
    border: 1px solid transparent;
    transition: transform 0.2s ease;
  }
  .contact-btn.wa {
    border-color: rgba(37, 211, 102, 0.4);
    background: rgba(37, 211, 102, 0.08);
  }
  .contact-btn.phone {
    border-color: rgba(0, 112, 209, 0.4);
    background: rgba(0, 112, 209, 0.08);
  }
  .btn-icon { font-size: 18px; }
  .btn-label { font-size: 11px; color: #94a3b8; display: block; text-align: right; }
  .btn-val { font-size: 14px; font-weight: 700; color: #f8fafc; letter-spacing: 0.5px; }
</style>
</head>
<body>
<div id="brand">
  <img src="ZainGames.png" alt="Zain Games">
  <div class="brand-text">
    <div class="brand-name">Zain Games</div>
    <div class="brand-sub">لخدمات البلايستيشن المتكاملة</div>
  </div>
</div>

<div id="container">
  <div id="wrap">
    <div id="state">جارٍ فحص إصدار النظام...</div>
    <div id="det"></div>
    
    <div class="fw-box">
      <div class="fw-title">الإصدارات المدعومة رسمياً في هذه النسخة:</div>
      <div class="fw-badges">
        <span class="fw-badge">13.02</span>
        <span class="fw-badge">13.04</span>
        <span class="fw-badge">13.50</span>
        <span class="fw-badge">13.52</span>
      </div>
    </div>

    <div id="cache"></div>
  </div>

  <div class="contact-section">
    <div class="contact-head">مركز Zain Games &bull; صيانة وتعديل وألعاب &bull; سوهاج</div>
    <div class="contact-grid">
      <a href="https://wa.me/201129060303" class="contact-btn wa" target="_blank">
        <span class="btn-icon">💬</span>
        <div>
          <span class="btn-label">واتساب</span>
          <span class="btn-val" dir="ltr">01129060303</span>
        </div>
      </a>
      <a href="tel:01064430855" class="contact-btn phone">
        <span class="btn-icon">📞</span>
        <div>
          <span class="btn-label">موبايل</span>
          <span class="btn-val" dir="ltr">01064430855</span>
        </div>
      </a>
    </div>
  </div>
</div>

<script>
(function () {
    var stateEl = document.getElementById("state");
    var detEl = document.getElementById("det");
    var cacheEl = document.getElementById("cache");
    function setState(t, c) { stateEl.textContent = t; stateEl.className = c || ""; }
    function setCache(t, ok) { cacheEl.textContent = t; cacheEl.className = ok ? "cacheok" : ""; }
    var params = new URLSearchParams(location.search);

    // Firmwares this build has a MEASURED kernel table for. jb.js still runs its
    // own kernel-table-present gate, so this is UX only -- an unlisted firmware
    // can still be launched with a tap. KEEP IN SYNC with ps4_offsets.js: add a
    // fwnum here in the SAME commit that fills that firmware's kernel RVAs.
    // The PS4 reports its minor as two hex digits in the UA (13.52 -> minor 0x52).
    var SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 }; // all measured on hardware

    var key = null, fwnum = null;
    var m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
    if (m) {
        var ms = parseInt(m[2], 16).toString(16);
        if (ms.length < 2) ms = "0" + ms;
        key = m[1] + "." + ms;
        fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
    }

    var forced = params.get("force") === "1";
    var supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
    detEl.innerHTML = "إصدار نظام جهازك: <b>" + (key || "غير معروف") + "</b> &bull; "
        + (supported ? "<b class='ok'>✓ مدعوم وجاهز للتفعيل</b>"
                     : "<span class='bad'>✗ غير مدعوم في هذه النسخة</span>");

    var target = "jb.html" + location.search;
    function go() { setState("جارٍ تشغيل الجيلبريك...", "warn"); location.replace(target); }

    function waitForTap(msg, action) {
        setState(msg, "warn");
        function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
        }
        window.addEventListener("click", fire);
        window.addEventListener("keydown", fire);
    }

    // Off-target consoles are not launched automatically -- one tap still runs
    // it, so a user-agent quirk on the real 13.52 console can never lock it out.
    if (!supported) {
        setState("إصدار غير مدعوم", "bad");
        waitForTap("إصدار النظام (" + (key || "غير معروف") + ") غير مدعوم حالياً -- اضغط X أو المس للمتابعة على أي حال", go);
        return;
    }

    var ac = window.applicationCache;
    if (!ac || !document.documentElement.hasAttribute("manifest")) {
        go();
    } else if (!navigator.onLine) {
        setCache("وضع عدم الاتصال -- تم التحميل من الذاكرة", true);
        go();
    } else if (ac.status === ac.IDLE) {
        setCache("محفوظ في الذاكرة (جاهز أوفلاين)", true);
        go();
    } else if (ac.status === ac.UPDATEREADY) {
        try { ac.swapCache(); } catch (e) {}
        setCache("تم تنزيل التحديث", true);
        waitForTap("التحديث جاهز -- اضغط X أو المس لإعادة التحميل والتشغيل",
                   function () { location.reload(); });
    } else {
        setCache("جارٍ التحقق من التخزين المؤقت...");
        ac.addEventListener("downloading",
            function () { setCache("جارٍ حفظ الملفات للاستخدام بدون إنترنت (التشغيل الأول)..."); }, false);
        ac.addEventListener("progress", function (e) {
            if (e && e.total)
                setCache("جارٍ الحفظ أوفلاين " + Math.round((e.loaded / e.total) * 100) + "%");
        }, false);
        ac.addEventListener("cached", function () {
            setCache("تم الحفظ للاستخدام بدون إنترنت", true);
            waitForTap("تم الحفظ بنجاح -- اضغط X أو المس للتشغيل", go);
        }, false);
        ac.addEventListener("updateready", function () {
            try { ac.swapCache(); } catch (e) {}
            setCache("تم تنزيل التحديث", true);
            waitForTap("التحديث جاهز -- اضغط X أو المس لإعادة التحميل والتشغيل",
                       function () { location.reload(); });
        }, false);
        ac.addEventListener("noupdate", function () {
            setCache("محفوظ -- جاهز للعمل بدون إنترنت", true);
            go();
        }, false);
        ac.addEventListener("error", function () {
            setCache("الكاش غير متوفر");
            waitForTap("فشل الكاش -- اضغط X أو المس للتشغيل على أي حال", go);
        }, false);
        ac.addEventListener("obsolete", function () {
            setCache("الكاش قديم");
            waitForTap("الكاش قديم -- اضغط X أو المس للتشغيل", go);
        }, false);
    }
})();
</script>
</body>
</html>
