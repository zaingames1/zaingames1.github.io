<!doctype html>
<html lang="ar" dir="rtl" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
    <title>Zain Games - V6</title>
    <link rel="icon" type="image/png" href="ZainGames.png" />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        max-width: 100vw;
        min-height: 100%;
        overflow-x: hidden !important;
        background: #0b0d10;
        color: #c8ced8;
        font:
          15px/1.45 "Segoe UI",
          system-ui,
          sans-serif;
      }
      #brand {
        text-align: center;
        padding: 10px 14px;
        background: #0e1116;
        border-bottom: 1px solid #1e2732;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      #brand img {
        width: 32px;
        height: 32px;
        border-radius: 8px;
        vertical-align: middle;
      }
      #brand b {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #e6ebf2;
        vertical-align: middle;
      }
      .v6-badge {
        display: inline-block;
        font-size: 11px;
        font-weight: 800;
        padding: 2px 7px;
        background: linear-gradient(135deg, #10b981, #00d2ff);
        color: #080a10;
        border-radius: 6px;
        vertical-align: middle;
        letter-spacing: 0.5px;
      }

      /* running: a spinner under the brand. jb.js sets body.done / body.fail / body.log. */
      #spin {
        position: fixed;
        top: calc(50% + 20px);
        left: 50%;
        width: 48px;
        height: 48px;
        margin: -24px 0 0 -24px;
        border: 4px solid #1e2732;
        border-top-color: #00d2ff;
        border-right-color: #10b981;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      #msg {
        position: fixed;
        top: 50%;
        left: 0;
        right: 0;
        transform: translateY(-50%);
        text-align: center;
        font-size: 18px;
        letter-spacing: 0.5px;
        display: none;
        padding: 0 20px;
        line-height: 1.6;
      }
      #wrap {
        padding: 0;
      }
      #state,
      #out {
        display: none;
      }

      body.done #spin {
        display: none;
      }
      body.fail #spin {
        display: none;
      }
      body.fail #msg {
        display: block;
        color: #d08a7f;
        font-weight: 700;
      }
      body.done #msg {
        display: block;
        color: #7fd0a0;
        font-weight: 700;
        letter-spacing: 2px;
      }

      /* ?log=1 -- the full step log, styled like the landing. */
      body.log #spin,
      body.log #msg {
        display: none;
      }
      body.log #wrap {
        padding: 14px 18px;
      }
      body.log #state {
        display: block;
        font-size: 22px;
        font-weight: 700;
        margin: 0 0 8px;
      }
      body.log #out {
        display: block;
        white-space: pre-wrap;
        font:
          12px/1.45 Consolas,
          monospace;
        background: #11151b;
        border: 1px solid #1e2732;
        border-radius: 5px;
        padding: 10px 12px;
        height: calc(100vh - 141px);
        overflow-y: auto;
      }
      .ok {
        color: #7fd0a0;
      }
      .bad {
        color: #d08a7f;
      }
      .warn {
        color: #d8c07f;
      }
      .safe {
        color: #7fd0a0;
      }
      .danger {
        color: #d08a7f;
      }
      code {
        color: #9fb3d0;
      }
    </style>
  </head>
  <body>
    <div id="brand">
      <img src="ZainGames.png" alt="Zain Games" width="32" height="32" />
      <b>Zain Games</b>
      <span class="v6-badge">V6</span>
    </div>
    <div id="spin"></div>
    <div id="msg">Restart your console</div>
    <div id="wrap">
      <div id="state"></div>
      <div id="out"></div>
    </div>
    <script type="module">
      import "./jb.js?v=19";
    </script>
  </body>
</html>
