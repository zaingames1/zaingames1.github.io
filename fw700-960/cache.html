<!DOCTYPE html>
<html lang="ar" dir="rtl" manifest="psfree_lapse.cache">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Zain Games - تثبيت الكاش (7.00 - 9.60)</title>
  <link rel="icon" type="image/png" href="ZainGames.png">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; min-height: 100vh;
      background: #080a10 radial-gradient(ellipse at 50% 10%, #151d30 0%, #080a10 80%);
      color: #cbd5e1;
      font-family: "Segoe UI", -apple-system, system-ui, Tahoma, sans-serif;
      font-size: 15px;
      line-height: 1.5;
    }
    #brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 12px 16px;
      background: #0d121c;
      border-bottom: 1px solid #1e293b;
      box-shadow: 0 4px 20px rgba(0,0,0,0.4);
    }
    #brand img {
      width: 38px; height: 38px;
      border-radius: 8px;
      box-shadow: 0 0 12px rgba(0, 112, 209, 0.4);
    }
    .brand-name {
      font-size: 18px;
      font-weight: 800;
      color: #f8fafc;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .brand-sub { font-size: 11px; color: #94a3b8; font-weight: 600; }
    #container { max-width: 500px; margin: 30px auto; padding: 0 16px; }
    #wrap {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 18px;
      padding: 26px 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      position: relative;
    }
    #wrap::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, #0070d1, #a855f7, #00d2ff);
    }
    .title { font-size: 20px; font-weight: 800; color: #f8fafc; margin: 0 0 8px; }
    .sub { font-size: 13px; color: #94a3b8; margin-bottom: 18px; }
    #console {
      font-family: "Cascadia Code", Consolas, monospace;
      background: #080a10;
      color: #38bdf8;
      border: 1px solid #1e293b;
      padding: 14px;
      border-radius: 12px;
      text-align: left;
      direction: ltr;
      min-height: 120px;
      font-size: 13px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="brand">
    <img src="ZainGames.png" alt="Zain Games">
    <div>
      <div class="brand-name">Zain Games</div>
      <div class="brand-sub">تعديل وصيانة البلايستيشن</div>
    </div>
  </div>

  <div id="container">
    <div id="wrap">
      <div class="title">جارٍ حفظ الكاش للعمل بدون إنترنت</div>
      <div class="sub">يرجى الانتظار قليلاً، سيتم تحويلك تلقائياً بعد اكتمال التخزين...</div>
      <pre id="console">[Cache] Initializing AppCache...</pre>
    </div>
  </div>

  <script>
    history.replaceState(null, null, 'index.html');
    var histlength = history.length;
    history.go(-histlength);

    const outputConsole = document.getElementById("console");
    window.log = (msg) => { outputConsole.textContent += msg + "\n"; };

    function DLProgress(e) {
      const percent = (Math.round((e.loaded / e.total) * 100));
      window.log(`[CACHE] Downloading... ${percent}% complete.`);
    }

    function DisplayCacheProgress() {
      window.log(" ");
      window.log("[SUCCESS] Cache installed successfully.");
      window.log("Page will reload in 2 seconds...");
      setTimeout(function() { location.reload(); }, 2000);
    }

    window.applicationCache.addEventListener("progress", DLProgress, false);
    window.applicationCache.oncached = function(e) { DisplayCacheProgress(); };
    window.applicationCache.onupdateready = function(e) { DisplayCacheProgress(); };

    document.addEventListener('DOMContentLoaded', () => {
      outputConsole.textContent = "";
      window.log("[CACHE] AppCache download initiating...");
      window.log("[INFO] Caching offline files for 7.00 - 9.60...");
    });
  </script>
</body>
</html>
